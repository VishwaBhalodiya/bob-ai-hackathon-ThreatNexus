submission:
  title: "ThreatNexus — AI-Powered Threat Intelligence & Alert Prioritisation Platform"

  problem_statement: >
    Security Operations Centre analysts receive thousands of daily alerts from SIEM systems,
    endpoint security tools, firewalls, and threat-intelligence feeds. The core problem is not
    detection — it is triage: deciding which alert to investigate first. Alert fatigue causes
    analysts to dismiss ~66% of all alerts uninvestigated, and the mean time to identify a breach
    is 204 days as a direct result (IBM Cost of a Data Breach Report 2023).

  solution_summary: >
    ThreatNexus is an AI-assisted threat intelligence and alert prioritisation platform. It
    automatically extracts Indicators of Compromise (IOCs) from alert text, enriches them with
    threat intelligence reputation data, correlates related events into attack stories, and
    calculates a transparent risk score (0–100) using asset criticality as context. IBM watsonx.ai
    (Granite 3 8B Instruct) then generates a plain-English explanation of why each alert is
    dangerous and recommends four concrete investigation steps, presenting the ranked queue
    on a real-time SOC dashboard.

  key_features:
    - "Weighted risk scoring engine combining source severity (20%), IOC reputation (35%), asset criticality (25%), threat category (10%), and correlation bonus (10%)"
    - "Regex-based IOC extraction (IP, domain, URL, MD5/SHA1/SHA256, email) with automatic threat intel DB enrichment"
    - "IOC-based and asset-proximity alert correlation grouping multi-stage attacks into visible attack storylines"
    - "IBM watsonx.ai (Granite 3 8B Instruct) threat explanation and investigation step generation with deterministic fallback"
    - "Real-time SOC analyst dashboard: prioritised alert queue, risk distribution donut chart, IOC chips, asset context panel, and threat intel feed"

  tech_stack:
    languages: ["Python", "TypeScript", "HTML", "CSS"]
    frameworks: ["FastAPI", "React", "Vite", "SQLAlchemy", "Pydantic"]
    ibm_technologies: ["IBM watsonx.ai", "IBM Bob AI", "Granite 3 8B Instruct"]
    databases: ["SQLite"]
    other: ["Recharts", "Uvicorn", "lucide-react", "Git", "GitHub", "VS Code", "Postman"]

  what_we_are_most_proud_of: >
    The end-to-end single-call enrichment pipeline: a raw alert enters the API and exits in
    milliseconds with extracted IOCs, a reputation-weighted risk score (with full component
    breakdown for explainability), a correlation group assignment if related events exist, and a
    watsonx.ai-generated plain-English explanation with four concrete investigation steps — all
    without any analyst intervention. The pipeline degrades gracefully to a deterministic template
    when watsonx.ai credentials are absent, making the full platform demo-ready offline.

  known_limitations: >
    Authentication is not implemented — all API endpoints are unauthenticated and not
    production-ready. The database is SQLite, scoped to local development use only. There are no
    live SIEM connectors — alerts are ingested via REST API. IOC extraction is regex-based and
    works best with structured log text; unstructured prose may miss some indicators. The
    watsonx.ai integration is optional; template-based explanations are used when credentials
    are not supplied.

